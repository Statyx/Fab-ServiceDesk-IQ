name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  no-client-leak:
    name: No client leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for leaked identifiers / customer names
        # The denylist lives in a secret, never in the repo. If the secret is not
        # configured the name rule is skipped with a warning — never a failure.
        env:
          CLIENT_DENYLIST: ${{ secrets.CLIENT_DENYLIST }}
        run: python scripts/check_repo_leaks.py
      - name: Ensure no generated data, local config or Windows-only script is tracked
        run: |
          if git ls-files 'artifacts/*' 'deployments/*' 'config.yaml' 'state.json' '.clientdeny' '*.ps1' '*.cmd' '*.bat' '*.pptx' | grep .; then
            echo "::error::Generated data, local profiles and Windows-only scripts must not be committed."
            exit 1
          fi
          echo "Clean."

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Materialize example config / state
        run: |
          cp config.example.yaml config.yaml
          cp state.example.json state.json
      - name: Generate the synthetic dataset (smoke)
        run: python -m fabric.data.generate_data
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
