  - {code: account_unlock,   service: SVC-IDENTITY, app: APP-IDP,     zero_touch: true,  weight: 0.08, title: "Unlock your account"}
  - {code: mfa_reenroll,     service: SVC-IDENTITY, app: APP-IDP,     zero_touch: true,  weight: 0.05, title: "Re-enrol multi-factor authentication"}
  - {code: vpn_connect,      service: SVC-NETWORK,  app: APP-VPN,     zero_touch: true,  weight: 0.09, title: "Fix Corporate VPN connection issues"}
  - {code: teams_call_quality, service: SVC-COLLAB, app: APP-TEAMS,   zero_touch: true,  weight: 0.09, title: "Improve Teams call quality"}
  - {code: outlook_sync,     service: SVC-MESSAGE,  app: APP-OUTLOOK, zero_touch: true,  weight: 0.10, title: "Fix Outlook synchronisation"}
  - {code: printer_issue,    service: SVC-PRINT,    app: APP-PRINT,   zero_touch: true,  weight: 0.07, title: "Solve common printing problems"}
  - {code: software_install, service: SVC-WORKPL,   app: APP-OFFICE,  zero_touch: true,  weight: 0.07, title: "Install approved software"}
  - {code: erp_access,       service: SVC-BUSAPP,   app: APP-ERP,     zero_touch: false, weight: 0.10, title: "Request ERP access"}
