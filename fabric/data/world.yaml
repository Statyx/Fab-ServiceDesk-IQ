# The scripted storyline. See docs/ARCHITECTURE.md § Storyboard.
scenario:
  id: vpn-lyon
  customer_id: CUS-FAB
  site_id: FAB-LYO
  app_id: APP-VPN
  bad_version: "6.1.0"
  good_version: "6.0.4"
  rollout_share: 0.8               # share of Lyon devices that received 6.1.0 (pilot ring)
  rollout_at: "2026-06-08T07:00:00Z"
  min_vip_impacted: 3
  incident_issues: {vpn_connect: 0.55, teams_call_quality: 0.45}
  incident_tickets: 100
  incident_zero_touch: 28
  tool_failure_rate: 0.9           # dem.get_device_health failures on escalated incident contacts
  major_incident:
    id: MI-FAB-0001
    declared_at: "2026-06-08T10:30:00Z"
    severity: Sev2
    title: "Corporate VPN drops and Teams call degradation at Fabrikam Lyon"
    root_cause: "Corporate VPN client 6.1.0 rolled out to the Lyon pilot ring"
  # Exact [tickets, zero_touch] per customer and ISO week (Monday). Everything else is
  # drawn from zero_touch_band. Fabrikam: 23/50 = 46.0% → 51/150 = 34.0% (−12 points).
  weekly_overrides:
    CUS-FAB:
      "2026-06-01": {tickets: 50, zero_touch: 23}
      "2026-06-08": {tickets: 150, zero_touch: 51}
    CUS-LIT:
      "2026-06-01": {tickets: 50, zero_touch: 23}
      "2026-06-08": {tickets: 50, zero_touch: 17, issue_bias: {hr_portal_access: 0.5}}
