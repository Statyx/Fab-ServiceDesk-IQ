# Zava Service Desk — the synthetic world.
#
# Everything here is FICTIONAL: Zava is a fictional managed-service operator and its
# customers are Microsoft's fictional companies. No real customer, partner or third-party
# product appears anywhere in this repository; tools are named generically (ITSM, DEM,
# Contact Center, CSAT tool, Corporate VPN).
#
# This file is committed on purpose and is the ONLY input of the generator, together
# with the seed: the dataset must be byte-identical on every machine, whatever the local
# config.yaml says. Tenant-specific values never belong here.

seed: 42
# Last day of history (UTC), a Sunday: the incident week is the last full ISO week.
# Phase 2 shifts every timestamp by a WHOLE number of weeks so ISO weeks stay aligned.
reference_date: "2026-06-14"
history_days: 90          # Lakehouse facts (tickets, CSAT, daily experience)
dem_history_days: 8       # dem_telemetry preload (hourly, 07:00–19:00 UTC)
trace_history_days: 14    # tickets_events / conversations / agent_traces / gateway_logs / csat_events

tickets_per_user_per_week: 0.30
persona_mix: {VIP: 0.05, Office: 0.50, Remote: 0.25, Frontline: 0.20}

