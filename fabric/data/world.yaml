# Contracts with XLA (eXperience Level Agreement) commitments. Deliberately divergent:
# Fabrikam and Litware share the same zero-touch threshold, but only Fabrikam's contract
# carries a service credit — same gap, different consequence. Clauses are fictional.
# Metrics: zero_touch_rate (%), csat_avg (1–5), experience_score_avg (0–100),
# time_lost_min_per_user (minutes lost per seat over the window).
contracts:
  - customer_id: CUS-FAB
    id: CTR-FAB-2026
    name: Fabrikam Digital Workplace Services
    start: "2026-01-01"
    end: "2028-12-31"
    penalty_cap_pct: 15
    xlas:
      - {metric: zero_touch_rate, comparator: ">=", threshold: 40, window: weekly, penalty_pct: 5,
         clause: "If the zero-touch resolution rate falls below 40.0% in any ISO week, Zava credits 5% of the monthly service fee for the month containing that week, within the monthly cap of 15%."}
      - {metric: csat_avg, comparator: ">=", threshold: 3.8, window: monthly, penalty_pct: 2,
         clause: "If the average CSAT score of a calendar month is below 3.8 out of 5, Zava credits 2% of that month's service fee."}
      - {metric: time_lost_min_per_user, comparator: "<=", threshold: 120, window: monthly, penalty_pct: 2,
         clause: "If the time lost to IT incidents exceeds 120 minutes per seat in a calendar month, Zava credits 2% of that month's service fee."}
  - customer_id: CUS-LIT
    id: CTR-LIT-2026
    name: Litware Service Desk Agreement
    start: "2025-07-01"
    end: "2027-06-30"
    penalty_cap_pct: 0
    xlas:
      - {metric: zero_touch_rate, comparator: ">=", threshold: 40, window: weekly, penalty_pct: 0,
         clause: "If the zero-touch resolution rate falls below 40.0% in any ISO week, Zava delivers a written remediation plan within 10 business days. No service credit applies."}
      - {metric: csat_avg, comparator: ">=", threshold: 3.8, window: monthly, penalty_pct: 0,
         clause: "The monthly average CSAT score is reported against a 3.8 target. No service credit applies."}
  - customer_id: CUS-CON
    id: CTR-CON-2026
    name: Contoso Store Support Services
    start: "2026-03-01"
    end: "2029-02-28"
    penalty_cap_pct: 10
    xlas:
      - {metric: zero_touch_rate, comparator: ">=", threshold: 35, window: weekly, penalty_pct: 3,
         clause: "If the zero-touch resolution rate falls below 35.0% in any ISO week, Zava credits 3% of the monthly service fee, within the monthly cap of 10%."}
      - {metric: csat_avg, comparator: ">=", threshold: 3.6, window: monthly, penalty_pct: 1,
         clause: "If the monthly average CSAT score is below 3.6 out of 5, Zava credits 1% of that month's service fee."}
  - customer_id: CUS-NOR
    id: CTR-NOR-2026
    name: Northwind Workplace Operations
    start: "2025-10-01"
    end: "2028-09-30"
    penalty_cap_pct: 8
    xlas:
      - {metric: csat_avg, comparator: ">=", threshold: 3.8, window: monthly, penalty_pct: 3,
         clause: "If the monthly average CSAT score is below 3.8 out of 5, Zava credits 3% of that month's service fee."}
      - {metric: experience_score_avg, comparator: ">=", threshold: 70, window: monthly, penalty_pct: 2,
         clause: "If the average device experience score of a calendar month is below 70 out of 100, Zava credits 2% of that month's service fee."}
  - customer_id: CUS-TAI
    id: CTR-TAI-2026
    name: Tailspin Operations Support
    start: "2026-02-01"
    end: "2028-01-31"
    penalty_cap_pct: 6
    xlas:
      - {metric: experience_score_avg, comparator: ">=", threshold: 72, window: weekly, penalty_pct: 2,
         clause: "If the average device experience score of any ISO week is below 72 out of 100, Zava credits 2% of the monthly service fee."}
      - {metric: zero_touch_rate, comparator: ">=", threshold: 30, window: monthly, penalty_pct: 2,
         clause: "If the zero-touch resolution rate of a calendar month is below 30.0%, Zava credits 2% of that month's service fee."}
  - customer_id: CUS-WOO
    id: CTR-WOO-2026
    name: Woodgrove Managed Workplace
    start: "2025-04-01"
    end: "2028-03-31"
    penalty_cap_pct: 12
    xlas:
      - {metric: zero_touch_rate, comparator: ">=", threshold: 30, window: monthly, penalty_pct: 3,
         clause: "If the zero-touch resolution rate of a calendar month is below 30.0%, Zava credits 3% of that month's service fee."}
      - {metric: time_lost_min_per_user, comparator: "<=", threshold: 120, window: monthly, penalty_pct: 4,
         clause: "If the time lost to IT incidents exceeds 120 minutes per seat in a calendar month, Zava credits 4% of that month's service fee."}
      - {metric: csat_avg, comparator: ">=", threshold: 3.7, window: monthly, penalty_pct: 2,
         clause: "If the monthly average CSAT score is below 3.7 out of 5, Zava credits 2% of that month's service fee."}

